# OpenTelemetry Configuration for ContentMap
# This configuration enables distributed tracing and metrics collection

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['localhost:8888']

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  resource:
    attributes:
      - key: service.name
        value: contentmap
        action: upsert
      - key: deployment.environment
        value: production
        action: upsert

  attributes:
    actions:
      - key: http.method
        action: insert
      - key: http.status_code
        action: insert
      - key: http.url
        action: insert

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: contentmap
    const_labels:
      environment: production

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  logging:
    loglevel: info

  # For production, you might want to use a cloud provider
  # otlp/datadog:
  #   endpoint: https://api.datadoghq.com
  #   headers:
  #     DD-API-KEY: ${DD_API_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, attributes]
      exporters: [otlp/jaeger, logging]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheus, logging]

  extensions: [health_check, pprof, zpages]

extensions:
  health_check:
    endpoint: :13133

  pprof:
    endpoint: :1777

  zpages:
    endpoint: :55679
