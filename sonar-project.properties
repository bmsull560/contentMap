# SonarCloud Configuration for contentMap
sonar.projectKey=bmsull560_contentMap
sonar.organization=bmsull560

# Project metadata
sonar.projectName=contentMap
sonar.projectVersion=1.0

# Source and test paths
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.js,**/*.config.ts

# Coverage configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/*.config.js,**/*.config.ts,src/vite-env.d.ts

# Code quality thresholds
sonar.qualitygate.wait=true
